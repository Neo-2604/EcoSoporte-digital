<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registro empresarial | EcoSoporte Digital</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/registro.css') }}">
          href="../static/css/registro.css">

</head>

<body>

<header>

    <nav>

        <div class="logo">
            ◆ EcoSoporte Digital
        </div>

        <a href="/login">
            Iniciar sesión
        </a>

    </nav>

</header>


<main>

    <section class="register-container">

        <div class="register-header">

            <span>
                REGISTRO EMPRESARIAL
            </span>

            <h1>
                Solicitud de acceso
            </h1>

            <p>
                Completa la información de tu empresa.
                La cuenta deberá ser autorizada por
                EcoSoporte Digital.
            </p>

        </div>


        <form method="POST"
              action="/registro">


            <h2>
                Información de la empresa
            </h2>


            <div class="form-grid">


                <div class="form-group">

                    <label for="razon_social">
                        Razón social
                    </label>

                    <input
                        type="text"
                        id="razon_social"
                        name="razon_social"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="nit">
                        NIT
                    </label>

                    <input
                        type="text"
                        id="nit"
                        name="nit"
                        placeholder="900123456-7"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="sector">
                        Sector comercial
                    </label>

                    <select
                        id="sector"
                        name="sector"
                        required
                    >

                        <option value="">
                            Seleccionar
                        </option>

                        <option value="Tecnologia">
                            Tecnología
                        </option>

                        <option value="Comercio">
                            Comercio
                        </option>

                        <option value="Educacion">
                            Educación
                        </option>

                        <option value="Salud">
                            Salud
                        </option>

                        <option value="Industria">
                            Industria
                        </option>

                        <option value="Servicios">
                            Servicios
                        </option>

                        <option value="Otro">
                            Otro
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="ciudad">
                        Ciudad
                    </label>

                    <input
                        type="text"
                        id="ciudad"
                        name="ciudad"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="telefono">
                        Teléfono
                    </label>

                    <input
                        type="tel"
                        id="telefono"
                        name="telefono"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="correo">
                        Correo empresarial
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        required
                    >

                </div>

            </div>


            <h2>
                Persona responsable
            </h2>


            <div class="form-group">

                <label for="nombre">
                    Nombre completo
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    required
                >

            </div>


            <button type="submit">
                Enviar solicitud
                <span>→</span>
            </button>


        </form>

    </section>

</main>

</body>

</html>
